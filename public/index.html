<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Paiement - Gestion Locative</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F5F0E8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 50px;
            color: #1F6FEB;
            margin-bottom: 1rem;
        }
        h1 {
            color: #1A2B5E;
            font-size: 24px;
            margin-bottom: 0.5rem;
        }
        p {
            color: #607086;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 12px 24px;
            background-color: #F2C94C;
            color: #1A2B5E;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">💳</div>
        <h1>Page de Test de Paiement</h1>
        <p>Ceci est la page <strong>index.html</strong> située dans le dossier public.</p>
        <p>Le lien de test fonctionne correctement !</p>
        <a href="#" class="btn" onclick="window.history.back()">Retour à l'app</a>
    </div>
</body>
</html>
